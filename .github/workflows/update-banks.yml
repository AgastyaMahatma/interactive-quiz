name: Update banks.json
on:
  push:
    branches: [main]
    paths:
      - "Question Bank/*.json"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate banks.json
        run: |
          cd "Question Bank"
          printf '%s\n' *.json | grep -v '^banks.json$' | jq -R . | jq -s . > banks.json
      - name: Commit if changed
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add "Question Bank/banks.json"
          git diff --cached --quiet || (git commit -m "Update banks.json" && git push)
