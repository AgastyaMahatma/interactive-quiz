name: Auto Generate Question Bank Index

on:
  push:
    paths:
      - 'Question Bank/**'

jobs:
  build-index:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # <--- REQUIRED: Gives GitHub Actions write access to push changes
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Generate Question Bank Index
        run: |
          cd "Question Bank"
          # Find all .json files except index.json and format into a JSON array
          ls *.json 2>/dev/null | grep -v 'index.json' | jq -R . | jq -s . > index.json || echo "[]" > index.json

      - name: Commit and Push index.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add "Question Bank/index.json"
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: update Question Bank/index.json" && git push)